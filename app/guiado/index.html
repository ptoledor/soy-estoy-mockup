<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ebe7dc">
  <meta name="robots" content="noindex">
  <title>Soy / Estoy · La entrada guiada se movió</title>
  <style>
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #ebe7dc;
      color: #171812;
      font-family: Aptos, "Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif;
      line-height: 1.55;
      text-align: center;
    }
    p { margin: 0 0 18px; color: #606157; max-width: 34ch; }
    a {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      padding: 0 22px;
      border: 1px solid #171812;
      background: #171812;
      color: #f4f1e9;
      text-decoration: none;
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <!-- El recorrido guiado dejó de ser una página aparte: ahora es el modo de
       primera visita de la app completa, así que Soy y Estoy comparten un solo
       documento y un solo núcleo de cálculo. Esta página sobrevive únicamente
       porque la URL publicada /app/guiado/ ya circuló y puede estar compartida.
       El contenido original está en el historial de git.

       El traslado se hace por JS y no con <meta refresh> para conservar el
       fragmento: es donde viajan nombre y fecha natal, que nunca van al query. -->
  <main>
    <p>La entrada guiada ahora vive dentro de la lectura completa.</p>
    <a id="go" href="./soy-estoy.html">Continuar</a>
  </main>
  <script>
    // Publicado, este archivo es app/guiado/index.html y la app queda un nivel
    // arriba; en el repo es scratchpad/guiado.html y la app es su vecina.
    var target = location.pathname.indexOf("/app/guiado/") !== -1 ? "../" : "./soy-estoy.html";
    var destination = target + location.hash;
    document.getElementById("go").href = destination;
    location.replace(destination);
  </script>
</body>
</html>
